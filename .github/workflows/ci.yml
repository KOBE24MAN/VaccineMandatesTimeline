name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate source data
        run: python validate_data.py
      - name: Run backend and data tests
        run: python -m pytest -q
      - name: Check delivery characters and file names
        run: python scripts/check_delivery_characters.py
      - name: Audit production Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Verify demo image builds
        run: docker build --file Dockerfile.demo --tag mandeval-demo:${{ github.sha }} .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend_client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
